[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = 'long'
quote_style = 'single'
number_underscore = 'thousands'
multiline_func_header = 'params_first_multi'
sort_imports = true

[profile.default]
solc_version = '0.8.30'
libs = ['node_modules', 'lib']
optimizer_runs = 10_000
evm_version = 'prague'

[profile.optimized]
via_ir = true
out = 'out-via-ir'

[profile.test]
via_ir = true
out = 'out-via-ir'

[profile.docs]
src = 'src/interfaces/'

[invariant]
timeout = 1000
show_metrics = true
fail_on_revert = true
corpus_dir = 'test/invariants/fuzz/corpus'
show_solidity = true

[fuzz]
runs = 1000

[rpc_endpoints]
ethereum = "${ETHEREUM_RPC}"
optimism = "${OPTIMISM_RPC}"

[etherscan]
ethereum = { key = "${ETHERSCAN_API_KEY}" }
optimism = { key = "${ETHERSCAN_API_KEY}" }
